name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,validate]" || pip install -e ".[dev]"
      - name: pytest（真实行情快照不随仓库分发，依赖快照的测试会跳过，原因见 -rs 汇总）
        run: pytest -q -rs
