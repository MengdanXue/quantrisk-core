[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantrisk-core"
version = "0.1.0"
description = "Technical indicators, strategy backtesting, factor research and valuation tools extracted from QuantRiskPro"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mengdan Xue" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
stats = ["statsmodels>=0.14"]
ml = ["scikit-learn>=1.4"]
demo = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "ta-lib>=0.6", "statsmodels>=0.14", "scikit-learn>=1.4", "fastapi>=0.110", "uvicorn>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
